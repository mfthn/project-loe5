name: project-loe5-microservices

services:
  # Database PostgreSQL Terpusat
  postgres:
    image: postgres:15-alpine
    container_name: loe_postgres
    environment:
      POSTGRES_USER: loe
      POSTGRES_PASSWORD: loe_dev
      POSTGRES_DB: project_loe5
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loe -d project_loe5"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 1. Auth Service (Port 8001 internal)
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: loe_auth_svc
    environment:
      DATABASE_URL: postgresql+psycopg://loe:loe_dev@postgres:5432/project_loe5
      AUTH_SECRET: lukla_operations_engine_super_secret_auth_key_2026_dev_secure
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 2. Manufacturing Service (Port 8002 internal)
  manufacturing-service:
    build:
      context: ./services/manufacturing-service
      dockerfile: Dockerfile
    container_name: loe_mfg_svc
    environment:
      DATABASE_URL: postgresql+psycopg://loe:loe_dev@postgres:5432/project_loe5
      AUTH_SECRET: lukla_operations_engine_super_secret_auth_key_2026_dev_secure
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 3. Finance Service (Port 8003 internal)
  finance-service:
    build:
      context: ./services/finance-service
      dockerfile: Dockerfile
    container_name: loe_finance_svc
    environment:
      DATABASE_URL: postgresql+psycopg://loe:loe_dev@postgres:5432/project_loe5
      AUTH_SECRET: lukla_operations_engine_super_secret_auth_key_2026_dev_secure
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 4. AI Agent Service (Port 8004 internal)
  ai-agent-service:
    build:
      context: ./services/ai-agent-service
      dockerfile: Dockerfile
    container_name: loe_ai_svc
    environment:
      DATABASE_URL: postgresql+psycopg://loe:loe_dev@postgres:5432/project_loe5
      AUTH_SECRET: lukla_operations_engine_super_secret_auth_key_2026_dev_secure
      ENVIRONMENT: development
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      DOCS_LOCAL_PATH: data/docs
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 5. Frontend Next.js (Port 3000 internal)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loe_frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api/v1
    restart: unless-stopped

  # 6. API Gateway Nginx (Satu-satunya port yang terekspos ke publik)
  gateway:
    image: nginx:alpine
    container_name: loe_gateway
    ports:
      - "3000:80"
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - manufacturing-service
      - finance-service
      - ai-agent-service
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
