events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Upstream Services
    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream auth_upstream {
        server auth-service:8001;
    }

    upstream manufacturing_upstream {
        server manufacturing-service:8002;
    }

    upstream finance_upstream {
        server finance-service:8003;
    }

    upstream ai_upstream {
        server ai-agent-service:8004;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check gateway
        location /gateway-health {
            return 200 '{"status":"ok","gateway":"project-loe5"}';
            add_header Content-Type application/json;
        }

        # 1. Auth Service Routes
        location /api/v1/auth/ {
            proxy_pass http://auth_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Manufacturing Service Routes (sample, gudang, produksi, qc)
        location ~ ^/api/v1/(sample|gudang|produksi|qc)/ {
            proxy_pass http://manufacturing_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Finance Service Routes (finance, payroll)
        location ~ ^/api/v1/(finance|payroll)/ {
            proxy_pass http://finance_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. AI Agent Service Routes (ai, ask, stream, reindex)
        location /api/v1/ai/ {
            proxy_pass http://ai_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Server-Sent Events (SSE) streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }

        # 5. Frontend Next.js (All web pages & static assets)
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Next.js HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
